name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deployment/backend/**'
      - '.github/workflows/backend-cicd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deployment/backend/**'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  APP_NAME: backend
  REGISTRY: myregistry.azurecr.io
  IMAGE_NAME: security-vuln-backend

jobs:
  # ================================================================
  # BUILD & TEST STAGE
  # ================================================================
  build:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run linting
      run: |
        cd backend
        pip install flake8
        flake8 app --max-line-length=120 --exclude=__pycache__

    - name: Run tests with coverage
      if: ${{ !inputs.skip_tests }}
      run: |
        cd backend
        pytest tests/ --cov=app --cov-report=xml --cov-report=term

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: backend/coverage.xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run container security scan
      uses: azure/container-scan@v0
      with:
        image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ================================================================
  # HELM VALIDATION STAGE
  # ================================================================
  helm-validate:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Helm lint
      run: |
        helm lint deployment/backend/ --strict
        
    - name: Helm template validation
      run: |
        helm template backend deployment/backend/ \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.dev.yaml \
          --set image.tag=${{ github.sha }}
        
        helm template backend deployment/backend/ \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.staging.yaml \
          --set image.tag=${{ github.sha }}
        
        helm template backend deployment/backend/ \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.prod.yaml \
          --set image.tag=${{ github.sha }}

  # ================================================================
  # DEVELOPMENT DEPLOYMENT
  # ================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, helm-validate]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: 
      name: development
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP_DEV }} --name ${{ secrets.AKS_CLUSTER_NAME_DEV }}

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Deploy to Dev
      run: |
        helm upgrade --install backend-dev deployment/backend/ \
          --namespace dev \
          --create-namespace \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.dev.yaml \
          --set image.tag=sha-${{ github.sha }} \
          --wait --timeout=10m

    - name: Verify deployment
      run: |
        kubectl get pods -n dev -l app.kubernetes.io/name=backend
        kubectl rollout status deployment/backend-dev -n dev

  # ================================================================
  # STAGING DEPLOYMENT (Requires Approval)
  # ================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, helm-validate, deploy-dev]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && contains(fromJson('["staging", "prod"]'), github.event.inputs.environment))
    environment: 
      name: staging
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP_STAGING }} --name ${{ secrets.AKS_CLUSTER_NAME_STAGING }}

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Deploy to Staging
      run: |
        helm upgrade --install backend-staging deployment/backend/ \
          --namespace staging \
          --create-namespace \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.staging.yaml \
          --set image.tag=sha-${{ github.sha }} \
          --wait --timeout=10m

    - name: Run smoke tests
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=backend -n staging --timeout=300s
        # Add your smoke tests here
        echo "Smoke tests completed successfully"

  # ================================================================
  # PRODUCTION DEPLOYMENT (Requires Approval)
  # ================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, helm-validate, deploy-staging]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: 
      name: production
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP_PROD }} --name ${{ secrets.AKS_CLUSTER_NAME_PROD }}

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Deploy to Production
      run: |
        helm upgrade --install backend-prod deployment/backend/ \
          --namespace prod \
          --create-namespace \
          --values deployment/backend/values.yaml \
          --values deployment/backend/values.prod.yaml \
          --set image.tag=sha-${{ github.sha }} \
          --wait --timeout=15m

    - name: Verify deployment
      run: |
        kubectl get pods -n prod -l app.kubernetes.io/name=backend
        kubectl rollout status deployment/backend-prod -n prod --timeout=600s
        
    - name: Run production health checks
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=backend -n prod --timeout=300s
        # Add your production health checks here
        echo "Production deployment completed and verified"

  # ================================================================
  # NOTIFICATION STAGE
  # ================================================================
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.deploy-prod.result == 'success'
      run: |
        echo "Backend deployment completed successfully to all environments"
        # Add Slack/Teams notification here if needed
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "Backend deployment failed. Check the logs for details."
        # Add failure notification here if needed